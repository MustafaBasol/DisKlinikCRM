name: ci-layers

# F1-003-P3 — reusable layered CI implementation. Not triggered directly;
# called by ci-pr.yml (every pull request into main) and
# ci-main-and-nightly.yml (push to main, nightly schedule, manual dispatch).
# Kept as a single reusable workflow so the two thin callers never duplicate
# job definitions (see docs/program/evidence/
# F1-003-P3_LAYERED_CI_WORKFLOWS_AND_FULL_SUITE_FAIL_SAFE.md and its P3-R1
# update for the full design record).
#
# Layer map:
#   Layer 1 (static/type/syntax) -> frontend-typecheck-and-build,
#                                   server-typecheck,
#                                   tooling-typecheck-and-unit,
#                                   architecture-guardrail-report-only,
#                                   log-privacy-guard-scan,
#                                   workflow-and-syntax-lint
#   Layer 2 (non-disposable backend)      -> non-disposable-backend-tests
#   Layer 3 (disposable PostgreSQL)       -> disposable-postgres-tests
#   Layer 4 (disposable PostgreSQL+MinIO) -> storage-integration-tests
#   Layer 5 (full-suite/compatibility fail-safe) -> full-suite-compatibility-failsafe-frontend,
#                                                    full-suite-compatibility-failsafe-backend
#
# F1-003-P3-R1: Layer 5 now has a backend half. The original P3 Layer 5 only
# covered the frontend leaf scripts; legacy `server:test` silently chains 23
# additional PostgreSQL-required/MinIO-free scripts (exact names in
# server/package.json's new `server:test:legacy-db-required` aggregate, and
# in docs/program/evidence/F1-003-P3_layered_ci_verification.json) that were
# not reachable from any CI-safe aggregate before this task. Closure: an
# additive `postgres-compat` profile was added to the existing, unmodified
# F1-003-P2 orchestrator (scripts/test-runtime/orchestrator.ts) - it reuses
# 100% of the `postgres` profile's provisioning/guard/migration/cleanup code
# path, only swapping which already-existing package script it executes.
# Legacy `server:test` itself is never read, invoked, or modified.
#
# Every job invokes an existing, already-accepted package script by name -
# none reproduces test file membership in YAML, and none reimplements the
# F1-003-P2 disposable PostgreSQL/MinIO provisioning mechanism
# (scripts/test-runtime/** is used exactly as merged, additively extended
# only with the new profile described above).
#
# F2-GUARDRAIL-IMPL-001: adds architecture-guardrail-report-only, a new
# standalone Layer 1 job for the exact-edge cross-domain-import guardrail
# authorized (repository-only, report-only, non-blocking) by
# docs/program/evidence/F2-SEC-003_SECURITY_GATE_RECONCILIATION.md section
# 6. Deliberately not added to any other job's `needs:` list and nothing
# needs it - see docs/program/evidence/F2-GUARDRAIL-IMPL-001_* for why a
# guardrail-tool failure must never gate application tests. Architectural
# findings always exit 0 (see scripts/architecture-guardrail/cli.ts); only a
# genuine tool/configuration/execution failure turns this job red.
#
# F3-CI-OPT-001: adds risk-based path-aware job selection for pull_request
# calls only (fastMode input, default false). Every job below keeps running
# unconditionally, exactly as before, whenever fastMode is false - this is
# the push-to-main/nightly/manual safety net and this task makes no change
# to its behavior. When fastMode is true (ci-pr.yml only), a new `classify`
# job inspects the PR's changed-file paths with the deterministic,
# repository-owned scripts/ci-classify/** classifier and each Layer 2-5 job
# becomes conditional on the category it maps to; Layer 1 (frontend build,
# server typecheck, tooling typecheck+unit, guardrail scan, log privacy
# guard scan, workflow/syntax lint) stays unconditional even in fastMode -
# those jobs are cheap (~15-55s each, fully parallel) and gating them
# individually would require conditioning every Layer 2-5 job's `needs:` on
# a job that might itself be skipped, a well-known GitHub Actions
# cascading-skip pitfall. Every Layer 2-5 job's `if:` explicitly falls back
# to running whenever fastMode is false, the classify job did not succeed,
# or any of that job's own `needs` failed/were cancelled - classification
# failures and infrastructure failures both fail closed (run everything),
# never open. See docs/program/evidence/
# F3-CI-OPT-001_RISK_BASED_PATH_AWARE_PR_CI.md for the full category -> gate
# mapping and the required-check safety argument.
#
# F3-CI-OPT-001-R1-LITE: wires the already-merged F3-IMPL-007 sensitive-
# runtime-logging regression guard (scripts/log-privacy-guard/**, merged to
# main via PR #399) into this same stable Layer 1 safety path as a new
# log-privacy-guard-scan job. Unlike architecture-guardrail-report-only
# (deliberately advisory/non-blocking, see its own comment below), this scan
# is a real gate: `--strict-baseline` fails the job on a new violation, a
# stale baseline exception, or a scanner/config error (see scripts/
# log-privacy-guard/cli.ts's documented exit-code contract), so it is also
# added to every Layer 2-5 job's `needs:` list, exactly like the other
# blocking Layer 1 jobs. No second required-check architecture is
# introduced - a failure here fails this reusable workflow's own result,
# which is what ci-pr.yml's single `PR Gate` job already keys off.

on:
  workflow_call:
    inputs:
      fastMode:
        description: >-
          When true (pull_request calls only), Layer 2-5 jobs become
          conditional on scripts/ci-classify/** output. When false (the
          default; push-to-main, nightly, and manual dispatch), every job
          runs unconditionally - unchanged from the pre-F3-CI-OPT-001
          behavior.
        type: boolean
        default: false
    outputs:
      docsOnly:
        value: ${{ jobs.classify.outputs.docs_only }}
      categoriesPresent:
        value: ${{ jobs.classify.outputs.categories_present }}
      runBackendGeneral:
        value: ${{ jobs.classify.outputs.run_backend_general }}
      runPostgres:
        value: ${{ jobs.classify.outputs.run_postgres }}
      runStorage:
        value: ${{ jobs.classify.outputs.run_storage }}
      runFrontendFullSuite:
        value: ${{ jobs.classify.outputs.run_frontend_full_suite }}
      runLegacyBackend:
        value: ${{ jobs.classify.outputs.run_legacy_backend }}

permissions:
  contents: read

env:
  NODE_VERSION: '20'

jobs:
  classify:
    name: 'Changed-path classification (risk-based PR gate selection)'
    if: inputs.fastMode == true && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.run-classifier.outputs.docs_only }}
      categories_present: ${{ steps.run-classifier.outputs.categories_present }}
      run_backend_general: ${{ steps.run-classifier.outputs.run_backend_general }}
      run_postgres: ${{ steps.run-classifier.outputs.run_postgres }}
      run_storage: ${{ steps.run-classifier.outputs.run_storage }}
      run_frontend_full_suite: ${{ steps.run-classifier.outputs.run_frontend_full_suite }}
      run_legacy_backend: ${{ steps.run-classifier.outputs.run_legacy_backend }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Fetch PR base and head commits for diffing
        # actions/checkout's default pull_request checkout is the merge
        # commit at depth 1 - neither the base nor head SHA's own commit
        # object is guaranteed present yet, so both are fetched explicitly
        # (same-repo PRs only; this repository does not accept fork PRs).
        run: git fetch --no-tags --depth=1 origin ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }}
      - name: List changed files (base...head)
        run: git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} > changed-files.txt
      - name: git diff --check (structural whitespace/conflict-marker sanity, non-blocking)
        # Informational only - this check did not exist before F3-CI-OPT-001
        # and turning it into a hard merge blocker would be a new, unrequested
        # behavior change. Findings are surfaced as a workflow annotation.
        run: |
          if ! git diff --check ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }}; then
            echo "::warning::git diff --check found whitespace or conflict-marker issues in this PR's diff (non-blocking, informational only)"
          fi
      - name: Run changed-path classifier
        id: run-classifier
        run: npx tsx scripts/ci-classify/cli.ts --files-from=changed-files.txt --github-output="$GITHUB_OUTPUT" --step-summary="$GITHUB_STEP_SUMMARY"

  frontend-typecheck-and-build:
    name: 'Layer 1: frontend typecheck + build'
    needs: [classify]
    if: >-
      inputs.fastMode == false ||
      needs.classify.result != 'success' ||
      needs.classify.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Frontend typecheck + build (tsc -b && vite build)
        run: npm run build

  server-typecheck:
    name: 'Layer 1: server typecheck'
    needs: [classify]
    if: >-
      inputs.fastMode == false ||
      needs.classify.result != 'success' ||
      needs.classify.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Server typecheck (prisma generate + tsc --noEmit)
        run: npm run typecheck

  tooling-typecheck-and-unit:
    name: 'Layer 1: test-runtime tooling typecheck + unit tests'
    needs: [classify]
    if: >-
      inputs.fastMode == false ||
      needs.classify.result != 'success' ||
      needs.classify.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Typecheck scripts/test-runtime
        run: npm run typecheck:runtime
      - name: Docker-free orchestrator unit tests
        run: npm run test:runtime:unit
      - name: Docker-free Layer 4 storage-gate regression tests
        run: npm run test:runtime:storage-gate
      # F4-CI-L4-STORAGE-GATE-001-R1. Gates the MinIO readiness path that
      # drained the event loop on PR #423 (run 31893589449, job 95040001240).
      # Runs here, in Layer 1, on purpose: it is Docker-free and it is a
      # `needs:` of Layer 4, so a regression is caught before a disposable
      # runtime is ever provisioned.
      - name: Docker-free MinIO readiness boundedness regression tests
        run: npm run test:runtime:minio-readiness
      - name: Typecheck scripts/ci-classify
        run: npm run typecheck:ci-classify
      - name: Changed-path classifier unit tests
        run: npm run test:ci-classify

  architecture-guardrail-report-only:
    name: 'Layer 1: architecture guardrail (advisory, report-only)'
    needs: [classify]
    if: >-
      inputs.fastMode == false ||
      needs.classify.result != 'success' ||
      needs.classify.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # F2-GUARDRAIL-IMPL-001 — repository-only, report-only, non-blocking
    # exact-edge cross-domain import drift detector (scripts/architecture-
    # guardrail/**). Deliberately NOT in any other job's `needs:` list and
    # nothing needs this job - a guardrail-tool failure must never make
    # application tests conditional on it (see this task's own evidence
    # doc). Architectural findings never fail this job - only a genuine
    # tool/configuration/execution failure does (see cli.ts's documented
    # exit-code contract). No `continue-on-error` is used, so a real crash
    # still turns this job red; findings alone never do.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Typecheck scripts/architecture-guardrail
        run: npm run typecheck:guardrail
      - name: Guardrail focused unit tests
        run: npm run guardrail:test
      - name: Run guardrail scan (report-only - exit 0 regardless of finding count; non-zero only on a real tool/config failure)
        run: npm run guardrail:scan -- --repo-sha=${{ github.sha }} --out=architecture-guardrail-report.json
      - name: Validate report artifact is real JSON
        run: node -e "JSON.parse(require('fs').readFileSync('architecture-guardrail-report.json','utf8')); console.log('architecture-guardrail-report.json is valid JSON')"
      - name: Scan report artifact for prohibited secret patterns
        run: |
          set -euo pipefail
          if grep -EiI 'postgresql://|postgres://|AKIA[0-9A-Z]{16}|BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY|secretAccessKey|accessKeyId["'"'"']?\s*[:=]|password["'"'"']?\s*[:=]' architecture-guardrail-report.json; then
            echo "Prohibited secret-like pattern found in artifact candidate - refusing to upload" >&2
            exit 1
          fi
          echo "No prohibited secret patterns detected in architecture-guardrail-report.json"
      - name: Upload architecture guardrail report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: architecture-guardrail-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: architecture-guardrail-report.json
          retention-days: 30

  log-privacy-guard-scan:
    name: 'Layer 1: log privacy guard (sensitive runtime logging regression scan)'
    needs: [classify]
    if: >-
      inputs.fastMode == false ||
      needs.classify.result != 'success' ||
      needs.classify.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # F3-CI-OPT-001-R1-LITE — blocking gate for the F3-IMPL-007 scanner
    # (scripts/log-privacy-guard/**). `--strict-baseline` makes the job fail
    # on a new violation, a stale baseline exception, or a scanner/config
    # error - never a silent pass. See the F3-CI-OPT-001-R1-LITE note atop
    # this file for why this job (unlike architecture-guardrail-report-only)
    # is also present in every Layer 2-5 job's `needs:` list below.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Typecheck scripts/log-privacy-guard
        run: npm run typecheck:log-privacy-guard
      - name: Log privacy guard unit tests
        run: npm run test:log-privacy-guard
      - name: Log privacy guard scan (blocking - strict baseline)
        run: npm run log-privacy-guard:scan -- --strict-baseline

  workflow-and-syntax-lint:
    name: 'Layer 1: workflow YAML, shell, PowerShell, and JSON validation'
    needs: [classify]
    if: >-
      inputs.fastMode == false ||
      needs.classify.result != 'success' ||
      needs.classify.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download and checksum-verify actionlint v1.7.12 (linux_amd64)
        run: |
          set -euo pipefail
          curl -sSL -o actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c -
          tar xzf actionlint.tar.gz actionlint
          chmod +x actionlint

      - name: actionlint (.github/workflows/**)
        run: ./actionlint -color

      - name: Shell syntax check (scripts/*.sh, scripts/test-runtime/*.sh)
        run: |
          set -euo pipefail
          # Widened in F4-FCR-002. This previously covered only
          # scripts/test-runtime/*.sh, which left every operator-facing script
          # in scripts/ — the deploy, healthcheck, opscheck, restore-rehearsal
          # and pgBackRest scripts — with no syntax gate at all.
          for f in scripts/*.sh scripts/test-runtime/*.sh; do
            [ -e "$f" ] || continue
            echo "== $f =="
            bash -n "$f"
          done

      - name: Operator shell test suites (opscheck, pgBackRest)
        run: |
          set -euo pipefail
          # These suites had NO automated enforcement before F4-FCR-002: they
          # were run by hand and their output pasted into an evidence file, so
          # a regression could only be caught if somebody remembered to run
          # them. They are hermetic (PATH-injected fakes, mktemp working dirs,
          # no network, no database, no real paths touched), so there is no
          # reason for them not to be a gate.
          npm run test:shell

      - name: PowerShell parser validation (scripts/test-runtime/*.ps1)
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Path scripts/test-runtime -Filter *.ps1 | ForEach-Object {
            Write-Host "== $($_.FullName) =="
            $errors = $null; $tokens = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      - name: JSON validation (package.json manifests)
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('package.json OK')"
          node -e "JSON.parse(require('fs').readFileSync('server/package.json','utf8')); console.log('server/package.json OK')"

  non-disposable-backend-tests:
    name: 'Layer 2: non-disposable backend tests'
    needs: [classify, frontend-typecheck-and-build, server-typecheck, tooling-typecheck-and-unit, log-privacy-guard-scan, workflow-and-syntax-lint]
    if: >-
      (inputs.fastMode == false ||
       needs.classify.result != 'success' ||
       needs.classify.outputs.run_backend_general == 'true') &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Generate Prisma Client
        # F1-003-P3-R1 root-cause fix: this job's own test files import
        # @prisma/client (server/src/db.ts) at module load time, but `npm ci`
        # alone does not generate it - no postinstall script does this in
        # server/package.json. Layers 3/4 never needed this explicit step
        # because the F1-003-P2 orchestrator's runMigrations() always
        # generates the client itself before running any test script; this
        # job calls server:test:non-disposable directly, without going
        # through the orchestrator, so it must generate the client itself.
        # Root-caused from the real GitHub Actions failure on this job in
        # PR #268's initial run (SyntaxError: the requested module
        # '@prisma/client' does not provide an export named 'PrismaClient'),
        # which a from-scratch CI checkout hits every time - not reproduced
        # locally only because this task's own local environment had already
        # generated the client via earlier, unrelated commands in the same
        # persistent working directory.
        run: npx prisma generate
      - name: server:test:non-disposable (68 members, zero external infra)
        run: npm run server:test:non-disposable

  disposable-postgres-tests:
    name: 'Layer 3: disposable PostgreSQL tests'
    needs: [classify, frontend-typecheck-and-build, server-typecheck, tooling-typecheck-and-unit, log-privacy-guard-scan, workflow-and-syntax-lint]
    if: >-
      (inputs.fastMode == false ||
       needs.classify.result != 'success' ||
       needs.classify.outputs.run_postgres == 'true') &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: server npm ci (server:test:disposable-db + prisma live under server/)
        run: npm ci
        working-directory: server
      - name: Provision disposable PostgreSQL, run server:test:disposable-db, tear down
        # --summary-file writes a genuine, standalone JSON file (F1-003-P3-R1)
        # separate from this step's own combined human-readable stdout log
        # (which GitHub Actions already captures in the job log on its own).
        run: npm run test:runtime:postgres -- --summary-file=postgres-run-summary.json
      - name: Validate run-summary artifact is real JSON (failure only)
        if: failure()
        run: node -e "JSON.parse(require('fs').readFileSync('postgres-run-summary.json','utf8')); console.log('postgres-run-summary.json is valid JSON')"
      - name: Scan run-summary artifact for prohibited secret patterns (failure only)
        if: failure()
        run: |
          set -euo pipefail
          if grep -EiI 'postgresql://|postgres://|AKIA[0-9A-Z]{16}|BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY|secretAccessKey|accessKeyId["'"'"']?\s*[:=]|password["'"'"']?\s*[:=]' postgres-run-summary.json; then
            echo "Prohibited secret-like pattern found in artifact candidate - refusing to upload" >&2
            exit 1
          fi
          echo "No prohibited secret patterns detected in postgres-run-summary.json"
      - name: Upload sanitized run summary (failure only)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: disposable-postgres-run-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: postgres-run-summary.json
          retention-days: 7
      - name: Label-scoped residual-resource check (fails on any leftover/cleanup error)
        if: always()
        run: npm run test:runtime:cleanup-stale -- --live --ttl-hours=0.01

  storage-integration-tests:
    name: 'Layer 4: disposable PostgreSQL + MinIO storage integration tests'
    needs: [classify, frontend-typecheck-and-build, server-typecheck, tooling-typecheck-and-unit, log-privacy-guard-scan, workflow-and-syntax-lint]
    if: >-
      (inputs.fastMode == false ||
       needs.classify.result != 'success' ||
       needs.classify.outputs.run_storage == 'true') &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: server npm ci (server:test:storage-integration + prisma live under server/)
        run: npm ci
        working-directory: server
      - name: Provision disposable PostgreSQL + MinIO, run server:test:storage-integration, tear down
        run: npm run test:runtime:storage -- --summary-file=storage-run-summary.json
      # F4-CI-L4-STORAGE-GATE-001. Everything below used to be `if: failure()`,
      # which is precisely how this job stayed green for weeks while executing
      # nothing: on the (vacuously) passing path the summary artifact was never
      # parsed, never checked and never even uploaded, so "green" meant only
      # "the process exited 0". These steps now run on EVERY outcome, and the
      # gate treats a missing/empty/unproven summary as a hard failure.
      - name: 'Gate: run summary must prove the storage suite actually executed'
        if: ${{ !cancelled() }}
        run: npm run verify:storage-run -- storage-run-summary.json --require-offhost-destination
      - name: Scan run-summary artifact for prohibited secret patterns
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          if [ ! -f storage-run-summary.json ]; then
            echo "No storage-run-summary.json to scan (the gate step above has already failed the job)."
            exit 0
          fi
          if grep -EiI 'postgresql://|postgres://|s3://|AKIA[0-9A-Z]{16}|BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY|secretAccessKey|accessKeyId["'"'"']?\s*[:=]|password["'"'"']?\s*[:=]' storage-run-summary.json; then
            echo "Prohibited secret-like pattern found in artifact candidate - refusing to upload" >&2
            exit 1
          fi
          echo "No prohibited secret patterns detected in storage-run-summary.json"
      - name: Upload sanitized run summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: storage-integration-run-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: storage-run-summary.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Label-scoped residual-resource check (fails on any leftover/cleanup error)
        if: always()
        run: npm run test:runtime:cleanup-stale -- --live --ttl-hours=0.01

  full-suite-compatibility-failsafe-frontend:
    name: 'Layer 5: full-suite/compatibility fail-safe (frontend)'
    needs: [classify, frontend-typecheck-and-build]
    if: >-
      (inputs.fastMode == false ||
       needs.classify.result != 'success' ||
       needs.classify.outputs.run_frontend_full_suite == 'true') &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Runs the frontend leaf test scripts and root:test:vitest, none of which
    # were reachable from any CI workflow prior to F1-003-P3 (see
    # docs/program/evidence/F1-002-P1_TEST_SCRIPT_REACHABILITY_RECONCILIATION.md,
    # "only 7 of 116 JS/TS test-related files reached by any workflow"). On
    # push-to-main/nightly/manual-dispatch (fastMode=false) this job has no
    # path filter and runs on every trigger unconditionally, so it cannot be
    # silently narrowed by this or any future PR-only optimization. See the
    # sibling `full-suite-compatibility-failsafe-backend` job for this
    # layer's backend half.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Frontend leaf test scripts (previously unreachable by any CI workflow)
        run: |
          npm run test:dicom-helpers
          npm run test:onboarding-helpers
          npm run test:pairing-poller
          npm run test:booking-widget-helpers
          npm run test:clinic-bulk-export-selection
          npm run test:communication-consent-matrix
          npm run test:patient-detail-tabs-helpers
      - name: Vitest suite
        run: npm run test:vitest

  full-suite-compatibility-failsafe-backend:
    name: 'Layer 5: full-suite/compatibility fail-safe (backend, legacy server:test DB-required members)'
    needs: [classify, frontend-typecheck-and-build, server-typecheck, tooling-typecheck-and-unit, log-privacy-guard-scan, workflow-and-syntax-lint]
    if: >-
      (inputs.fastMode == false ||
       needs.classify.result != 'success' ||
       needs.classify.outputs.run_legacy_backend == 'true') &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # F1-003-P3-R1: closes the gap the original P3 Layer 5 left open. Legacy
    # `server:test` (server/package.json, untouched by this task) silently
    # chains 23 scripts that are PostgreSQL-required/MinIO-free and were not
    # members of `server:test:non-disposable`, `server:test:disposable-db`,
    # or `server:test:storage-integration` - see the new, additive
    # `server:test:legacy-db-required` aggregate (exact 23 names) and the
    # `postgres-compat` orchestrator profile that runs it against a
    # disposable PostgreSQL using the exact same provisioning/guard/
    # migration/cleanup/pinning/collision-avoidance code path as the existing
    # `postgres` profile (Layer 3) - no second PostgreSQL implementation, no
    # change to legacy `server:test` itself.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: server npm ci (server:test:legacy-db-required + prisma live under server/)
        run: npm ci
        working-directory: server
      - name: Provision disposable PostgreSQL, run server:test:legacy-db-required, tear down
        run: npm run test:runtime:postgres-compat -- --summary-file=postgres-compat-run-summary.json
      - name: Validate run-summary artifact is real JSON (failure only)
        if: failure()
        run: node -e "JSON.parse(require('fs').readFileSync('postgres-compat-run-summary.json','utf8')); console.log('postgres-compat-run-summary.json is valid JSON')"
      - name: Scan run-summary artifact for prohibited secret patterns (failure only)
        if: failure()
        run: |
          set -euo pipefail
          if grep -EiI 'postgresql://|postgres://|AKIA[0-9A-Z]{16}|BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY|secretAccessKey|accessKeyId["'"'"']?\s*[:=]|password["'"'"']?\s*[:=]' postgres-compat-run-summary.json; then
            echo "Prohibited secret-like pattern found in artifact candidate - refusing to upload" >&2
            exit 1
          fi
          echo "No prohibited secret patterns detected in postgres-compat-run-summary.json"
      - name: Upload sanitized run summary (failure only)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: postgres-compat-run-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: postgres-compat-run-summary.json
          retention-days: 7
      - name: Label-scoped residual-resource check (fails on any leftover/cleanup error)
        if: always()
        run: npm run test:runtime:cleanup-stale -- --live --ttl-hours=0.01
