# F3-SEC-EXIT-001 — dependency-scan/update availability.
#
# Prior to this file, the repository had no dependency-scanning mechanism of
# any kind: no Dependabot config, no CodeQL, no `npm audit` CI step, no Snyk.
# This closes that gap the least invasive way available — Dependabot's
# security-update alerts/PRs require no new CI job, no new secret, and cannot
# fail an existing workflow (it opens PRs on its own schedule; it does not run
# inside ci-layers.yml/ci-pr.yml/ci-main-and-nightly.yml). Vulnerability
# *alerting* itself (Dependabot alerts on the Security tab) is a GitHub
# repository setting, not something a committed file controls — see the
# external verification checklist in the F3-SEC-EXIT-001 evidence doc for the
# one-time repository-settings step this file does not (and cannot) automate.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  - package-ecosystem: "npm"
    directory: "/server"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  - package-ecosystem: "npm"
    directory: "/bridge-agent"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
